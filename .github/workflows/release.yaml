name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Open vSwitch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openvswitch/ovs
          path: ovs
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: step-security/setup-uv@e2eb4db858a6e128febbb7954cb46cb8b1f1e1d3 # v10.0.1
        with:
          enable-cache: true

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run hack/release.py --self-test
          uv run hack/release.py
